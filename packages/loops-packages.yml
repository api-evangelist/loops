note: >-
  Five first-party SDKs plus a first-party CLI, all published under the Loops-so
  GitHub organization and released to their language registries. Versions and
  publish dates below were read from each registry's own metadata endpoint on
  2026-08-13. Every official package except the Nuxt module shipped a release in
  August 2026, so the client layer tracks the 1.21.x API rather than lagging it;
  the Nuxt module (nuxt-loops 1.1.0) has not been released since 2024-10-17 and
  is the one abandonment signal in the set.
