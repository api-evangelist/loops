event_surface:
  see: asyncapi/loops-webhooks-asyncapi.yml
  note: >-
    The webhook payloads project a deliberately reduced view of this graph:
    WebhookContactIdentity (id, email, userId), WebhookContact, WebhookEmail and
    WebhookMailingList, rather than the full Contact or EmailMessage objects.
observations:
  - >-
    EmailMessage is the true centre of gravity. Three product concepts —
    campaigns, workflow send-nodes and transactional templates — are three
    front doors onto the same content object, which is why the LMX skill and
    the content API rate limit apply across all three.
  - >-
    Optimistic concurrency is real but partial: content revisions on email
    messages and revision ids on workflows, nothing on contacts or campaigns.
  - >-
    Events are write-only. There is no way to read the events you sent, only
    the EventPatterns Loops inferred from them.
