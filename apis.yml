- aid: loops:loops-webhooks
  name: Loops Webhooks
  description: Outbound event surface. Seventeen signed event types covering contact lifecycle, mailing-list membership,
    and email delivery, engagement and complaint signals, delivered by HTTP POST to one subscriber-configured endpoint
    per account and verified with an HMAC-SHA256 signature over {webhook-id}.{webhook-timestamp}.{raw-body}.
