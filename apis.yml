aid: loops
url: https://raw.githubusercontent.com/api-evangelist/loops/refs/heads/main/apis.yml
name: Loops
kind: company
description: Loops is an email platform built for software companies, combining marketing campaigns, product and
  lifecycle automation, and transactional email on one contact model. Its REST API v1 exposes 64 operations across
  contacts, contact properties, mailing lists, audience segments, events and event patterns, campaigns, transactional
  emails, email messages authored in its own LMX markup, themes, components, uploads and workflow graphs, plus a
  17-event signed webhook surface. Loops publishes its OpenAPI 3.1 document openly, ships first-party SDKs for JavaScript,
  Go, PHP, Ruby and Nuxt, a Go CLI, four versioned Agent Skills, and a hosted OAuth-protected MCP server at mcp.loops.so.
  Pricing is based on stored subscribed contacts rather than send volume, with a permanent free tier. The operating
  company is Astrodon Corporation.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: true
  label: Free plan, self-serve signup
  confidence: high
  source:
  - https://loops.so/pricing
  - https://loops.so/docs/api-reference/intro
  generated: '2026-08-13'
  method: searched
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/loops.png
tags:
- Email
- Email API
- Marketing Automation
- Transactional Email
- Lifecycle Email
- Webhooks
- SaaS
- Communications
- Developer Tools
- MCP
- Agents
- Campaigns
