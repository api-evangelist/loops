notable_older:
  - date: '2025-09-29'
    highlight: Webhooks became generally available to all users.
  - date: '2025-09-11'
    breaking: false
    deprecation: true
    highlight: >-
      All endpoints now return `success` and `message` in error response bodies.
      The top-level `error` and `path` keys were deprecated the same day, "but
      will continue to be supported for some time for backward compatibility" —
      no removal date was given. Both fields are still marked
      `deprecated: true` in OpenAPI 1.21.6, roughly eleven months later.
  - date: '2025-04-29'
    highlight: '`Idempotency-Key` header added to the Send event endpoint.'
  - date: '2025-03-28'
    highlight: '`Idempotency-Key` header added to the Send transactional email endpoint.'
  - date: '2025-01-14'
    deprecation: true
    highlight: >-
      List custom fields endpoint deprecated in favour of List contact
      properties. The deprecated endpoint is no longer present in OpenAPI
      1.21.6, so it has since been removed.
observations:
  - >-
    Cadence is high and the log is genuinely maintained — twelve dated entries
    in the six months to 2026-07-23, and the OpenAPI moved from 1.8.0 to 1.21.6
    over the same period.
  - >-
    Deprecations are announced with a rationale but never with a sunset date,
    and Loops publishes no Deprecation/Sunset response headers (RFC 8594). A
    client cannot detect a deprecation at runtime; it has to read this page.
  - >-
    Several endpoint families shipped as "open alpha" (campaigns 2026-04-24,
    transactional emails 2026-06-05, workflows 2026-06-22) with no published
    stability policy for what alpha means or when it ends.
