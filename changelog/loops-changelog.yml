versioning: >-
  The changelog is dated, not versioned. The OpenAPI document carries its own
  semantic version in info.version (1.21.6 as of 2026-08-13) and the changelog
  header describes itself as covering "new endpoints, fields, breaking changes,
  and deprecations across OpenAPI versions", but individual entries are not
  stamped with the OpenAPI version they landed in, so a consumer cannot map a
  dated entry to a spec version without diffing.
