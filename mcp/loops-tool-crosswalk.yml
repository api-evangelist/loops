    note: >-
      Runs a chosen Loops API operation for a chosen team. Because the operation
      is selected at call time rather than baked into the tool, `execute`
      inherits the parameters and requestBody of whichever OpenAPI operation the
      agent names — the full set is listed above. Loops' own summary of the
      server names contacts, mailing lists, events, transactional email and
      teams explicitly, and then "the other operations exposed by the Loops
      API", which is why all 64 are listed rather than a curated subset.
  - tool: describe
    category: discovery
    binding: spec-introspection
    confidence: high
    rest: []
    note: >-
      Inspects the request shape of an operation. It reads the same contract as
      openapi/_original/loops-openapi.yaml but is not itself a REST operation,
      so it binds to no operationId.
  - tool: search
    category: discovery
    binding: spec-introspection
    confidence: high
    rest: []
    note: >-
      Finds the right Loops API operation for a task. Searches the contract, not
      the account data; binds to no operationId.
  - tool: teams
    category: account
    binding: semantic
    confidence: medium
    rest:
      - testApiKey
    note: >-
      Lists the Loops teams the authenticated user can access and lets the
      client choose which team a call runs against. `GET /v1/api-key`
      (testApiKey) is the only REST operation that returns team context
      (`teamName`), but it returns exactly one team for one key rather than a
      list, so this is a semantic match, not an equivalence. Multi-team
      selection has no REST equivalent.
mcp_only:
  - tool: search
    reason: Contract discovery over the OpenAPI document; no REST operation performs it.
  - tool: describe
    reason: Contract introspection; the equivalent for a REST client is reading the spec.
  - tool: teams
    reason: >-
      Enumerating every team an identity can reach is an OAuth-session concept.
      REST keys are scoped to a single team, so there is no list-teams operation.
rest_only: []
