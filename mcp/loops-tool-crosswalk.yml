source: mcp/loops-mcp.yml + openapi/_original/loops-openapi.yaml (1.21.6)
note: >-
  Loops does not publish one MCP tool per REST operation, so this crosswalk does
  not look like the usual one-to-one table. The server exposes four META-tools —
  search, describe, execute, teams — that dispatch to the REST surface at
  runtime. The binding below is therefore `dynamic-dispatch`: `execute` is the
  single tool that reaches all 64 OpenAPI operations, and `search`/`describe`
  operate over the specification itself rather than over any one operation.
  Live tool schemas are OAuth-gated (tools/list returns 401), so every row is
  mapped from the provider's published description of each tool, and confidence
  is set accordingly. No GraphQL surface exists.
surfaces:
  openapi:
    file: openapi/_original/loops-openapi.yaml
    version: 1.21.6
    servers:
      - https://app.loops.so/api
    operations: 64
    gated: false
    note: The spec itself is public at https://app.loops.so/openapi.json (HTTP 200, anonymous).
  graphql:
    present: false
  mcp:
    endpoint: https://mcp.loops.so
    transport: streamable-http
    gated: true
    note: tools/list returns HTTP 401 with an RFC 9728 Bearer challenge, scope "mcp".
