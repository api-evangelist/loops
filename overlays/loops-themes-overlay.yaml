overlay: 1.0.0
info:
  title: API Evangelist enhancements — Loops Themes API
  version: 1.0.0
  description: 'OpenAPI Overlay 1.0.0 capturing the enhancements API Evangelist derived for the Loops Themes API. It does NOT modify the provider contract on disk: openapi/loops-themes-api-openapi.yml is saved verbatim from https://app.loops.so/openapi.json and this overlay is applied on top. Everything added here is sourced from Loops'' own published documentation — the rate-limit tiers and response headers from https://loops.so/docs/api-reference/intro, the error envelope from the spec''s own 4xx schemas, and the Idempotency-Key contract from the header parameter Loops declares on its two send operations. Nothing is invented.'
