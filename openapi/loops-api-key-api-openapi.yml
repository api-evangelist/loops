openapi: 3.2.0
info:
  title: Loops OpenAPI Spec API key API
  description: This is the OpenAPI Spec for the Loops API.
  version: 1.21.6
servers:
- url: https://app.loops.so/api
tags:
- name: API Key
paths:
  /v1/api-key:
    get:
      operationId: testApiKey
      tags:
      - API Key
      summary: API key
      description: Test your API key and get team context.
      x-mint:
        href: /api-reference/api-key
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                    - true
                  teamName:
                    type: string
                    description: The name of the team the API key belongs to.
                    examples:
                    - Company name
                required:
                - success
                - teamName
        '401':
          description: Invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                    - false
                  message:
                    type: string
                    examples:
                    - Invalid API key
                  error:
                    type: string
                    deprecated: true
                    examples:
                    - Invalid API key
      security:
      - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
x-provenance:
  method: harvested
  publisher: Loops
  source: https://app.loops.so/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
